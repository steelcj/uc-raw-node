# vars/defaults.yml
#
# Controller defaults, loaded by the entry playbooks through vars_files.
# These sit above role defaults, so they outrank a transport role's
# defaults/main.yml when names collide. Override any of them with -e.

# Repository root. Every repository-relative path below is built from it.
# The entry playbooks live at the root, so playbook_dir is the root; test
# playbooks in tests/ set it to "{{ playbook_dir }}/.." in tests/vars/output.yml.
raw_node_root: "{{ playbook_dir }}"

# Registry layers, merged in order. Add a client layer by appending its
# file, for example registry/clients/<client>.yml.
raw_node_registry_files:
  - "{{ raw_node_root }}/registry/base.yml"

# Contract input arrives as extra vars (-e @raw-node-input.yml). To read it
# from a file instead, set raw_node_input_file (-e raw_node_input_file=<path>).

raw_node_input_required_fields:
  - hostname
  - root_password_hash
  - initial_username
  - initial_password_hash
  - ssh_public_key

raw_node_strategies:
  - cloud_init
  - installer
  - image
  - adopt

# Only list transports whose raw_node_transport_<name> role exists.
# incus_exec is the first transport with a role.
raw_node_known_transports:
  - incus_exec

raw_node_platform_defaults:
  datasource: null
  fallback: null
  phone_home: required
  firewall_clause: applies
  vps_modes: []
  status: unverified
  notes: ""

# Output paths. prepare_paths.yml expands each one once and sets the
# expanded value under a separate name (raw_node_records_dir and so on),
# which later steps read. Relative paths are taken from raw_node_root.
raw_node_records_path: "{{ raw_node_root }}/records"
raw_node_reports_path: "{{ raw_node_root }}/reports"
raw_node_logs_path: "{{ raw_node_root }}/logs"
raw_node_secrets_path: "~/.secrets/uc-raw-node"

# Seconds wait_phone_home.yml waits for the node's address or report.
raw_node_report_timeout: 600
